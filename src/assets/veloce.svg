<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <linearGradient id="vsilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="cred" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#vbg)"/>
  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="440" rx="16" fill="#111218" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="55" cy="55" r="5" fill="#ef4444"/>
  <circle cx="72" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="89" cy="55" r="5" fill="#10b981"/>
  <text x="400" y="60" fill="#a1a1aa" font-size="12" font-family="monospace" text-anchor="middle">veloce-lime-five.vercel.app — 3D WebGL Vehicle Experience</text>
  
  <!-- Car Silhouette / Geometric lines -->
  <path d="M120 280 C200 240, 260 170, 380 160 C520 150, 620 220, 680 270 C710 290, 720 320, 680 330 L120 330 Z" fill="#1c1d25" stroke="#3f3f46" stroke-width="2" opacity="0.7"/>
  <circle cx="240" cy="330" r="42" fill="#0d0e12" stroke="url(#cred)" stroke-width="3"/>
  <circle cx="580" cy="330" r="42" fill="#0d0e12" stroke="url(#cred)" stroke-width="3"/>
  <circle cx="240" cy="330" r="20" fill="#27272a"/>
  <circle cx="580" cy="330" r="20" fill="#27272a"/>
  
  <!-- Main Title -->
  <text x="400" y="140" fill="url(#vsilver)" font-size="36" font-weight="900" font-family="sans-serif" letter-spacing="12" text-anchor="middle">V E L O C E</text>
  <text x="400" y="175" fill="#9ca3af" font-size="13" font-family="sans-serif" text-anchor="middle">The 04 Coupe. Assembled in Modena. 3D WebGL Interactive Showcase.</text>
  
  <!-- CTA badges -->
  <rect x="260" y="390" width="130" height="36" rx="8" fill="#000000" stroke="#52525b" stroke-width="1"/>
  <text x="325" y="413" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Configure 3D</text>
  <rect x="410" y="390" width="130" height="36" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="475" y="413" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">The Engineering</text>
  
  <!-- Spec Pills -->
  <g font-size="10" font-family="monospace" font-weight="bold">
    <rect x="60" y="90" width="120" height="24" rx="4" fill="#1e1f29" stroke="#2e303e"/>
    <text x="120" y="106" fill="#ef4444" text-anchor="middle">⚡ 3D THREE.JS</text>
    <rect x="620" y="90" width="120" height="24" rx="4" fill="#1e1f29" stroke="#2e303e"/>
    <text x="680" y="106" fill="#10b981" text-anchor="middle">✦ 60 FPS WEBGL</text>
  </g>
</svg>

