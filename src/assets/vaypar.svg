    </radialGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151d" />
      <stop offset="100%" stop-color="#0e0f14" />
    </linearGradient>
  </defs>
