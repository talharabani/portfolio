  <text x="952" y="445" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Invoice #VP-2026-9041 • Paid</text>
  <line x1="835" y1="455" x2="1070" y2="455" stroke="#2d3142" stroke-dasharray="3 3" />

