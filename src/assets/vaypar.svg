  <text x="400" y="650" fill="#94a3b8" font-family="sans-serif" font-size="11">Tue</text>
  <text x="460" y="650" fill="#94a3b8" font-family="sans-serif" font-size="11">Wed</text>
  <text x="520" y="650" fill="#94a3b8" font-family="sans-serif" font-size="11">Thu</text>
  <text x="580" y="650" fill="#94a3b8" font-family="sans-serif" font-size="11">Fri</text>
  <text x="640" y="650" fill="#94a3b8" font-family="sans-serif" font-size="11">Sat</text>
  <text x="700" y="650" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Today</text>

