  <text x="1065" y="500" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="end">60,750</text>

  <line x1="835" y1="520" x2="1070" y2="520" stroke="#2d3142" stroke-dasharray="3 3" />

  <text x="840" y="545" fill="#94a3b8" font-family="monospace" font-size="11">Subtotal:</text>
  <text x="1065" y="545" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="end">114,350</text>

  <text x="840" y="570" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">NET TOTAL (PKR):</text>
  <text x="1065" y="570" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">114,350</text>

