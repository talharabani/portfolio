<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="750" fill="#0a0a0c" />
  <rect width="1200" height="750" fill="radial-gradient(circle at 50% 30%, rgba(220, 38, 38, 0.15), transparent 70%)" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0e0e12" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#grid)" />

  <!-- Top App Bar -->
  <rect x="80" y="50" width="1040" height="56" rx="14" fill="#121217" stroke="#22222a" stroke-width="1.5" />
  <circle cx="116" cy="78" r="6" fill="#ef4444" />
  <circle cx="136" cy="78" r="6" fill="#eab308" />
  <circle cx="156" cy="78" r="6" fill="#22c55e" />
  <text x="185" y="83" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">AGENTLINK</text>
  <text x="280" y="83" fill="#dc2626" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">• AI AGENT REMOTE CONTROL</text>
  <rect x="940" y="66" width="150" height="25" rx="12" fill="#1c1214" stroke="#dc2626" stroke-width="1" />
  <circle cx="956" cy="78" r="3.5" fill="#22c55e" />
  <text x="968" y="82" fill="#fca5a5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">CONNECTED: ONLINE</text>

  <!-- Left: Main IDE Monitoring Card -->
  <rect x="80" y="130" width="620" height="540" rx="20" fill="url(#cardGrad)" stroke="#272732" stroke-width="1.5" />
  
  <!-- Agent Status Tab -->
  <rect x="110" y="160" width="560" height="60" rx="12" fill="#181822" stroke="#272736" stroke-width="1" />
  <rect x="126" y="176" width="28" height="28" rx="6" fill="#dc2626" />
  <text x="133" y="195" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">AI</text>
  <text x="166" y="187" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Antigravity Coding Agent (Cursor / VS Code)</text>
  <text x="166" y="206" fill="#71717a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">Workspace: /portfolio/src • Active Task: Cloud Deployment Sync</text>
  <rect x="580" y="175" width="70" height="28" rx="6" fill="#0f291e" stroke="#10b981" stroke-width="1" />
  <text x="592" y="193" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">RUNNING</text>

  <!-- Code / Terminal Action Stream -->
  <rect x="110" y="240" width="560" height="240" rx="12" fill="#090a0d" stroke="#1f2029" stroke-width="1" />
  <text x="130" y="270" fill="#71717a" font-family="monospace" font-size="12">$ antigravity agent --task "Setup Vercel production &amp; Neon DB"</text>
  <text x="130" y="300" fill="#22c55e" font-family="monospace" font-size="12">✓ Neon PostgreSQL connection established (Postgres 18.6)</text>
  <text x="130" y="330" fill="#38bdf8" font-family="monospace" font-size="12">ℹ 6/6 Database Security tests verified successfully</text>
  <text x="130" y="360" fill="#f59e0b" font-family="monospace" font-size="12">⚠ PERMISSION REQUIRED: Execute cloud deployment command</text>
  <text x="130" y="390" fill="#ef4444" font-family="monospace" font-size="12">&gt; Command: vercel --prod --yes --confirm</text>
  
  <rect x="130" y="420" width="520" height="40" rx="8" fill="#1c1214" stroke="#dc2626" stroke-width="1" />
  <circle cx="150" cy="440" r="4" fill="#dc2626" />
  <text x="165" y="445" fill="#fca5a5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Pending Remote User Approval via Mobile Device...</text>

  <!-- Bottom Metric Pills -->
  <rect x="110" y="500" width="170" height="50" rx="10" fill="#161620" stroke="#262633" />
  <text x="125" y="522" fill="#a1a1aa" font-family="sans-serif" font-size="11">Remote Latency</text>
  <text x="125" y="542" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">24 ms (Real-time)</text>

  <rect x="300" y="500" width="170" height="50" rx="10" fill="#161620" stroke="#262633" />
  <text x="315" y="522" fill="#a1a1aa" font-family="sans-serif" font-size="11">Security Layer</text>
  <text x="315" y="542" fill="#22c55e" font-family="sans-serif" font-size="15" font-weight="bold">VAPID &amp; Session Auth</text>

  <rect x="490" y="500" width="180" height="50" rx="10" fill="#161620" stroke="#262633" />
  <text x="505" y="522" fill="#a1a1aa" font-family="sans-serif" font-size="11">Cross-Device</text>
  <text x="505" y="542" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="bold">Mobile &amp; Web App</text>

  <!-- Right: Mobile Device Phone Preview -->
  <rect x="740" y="130" width="380" height="540" rx="28" fill="#0d0e14" stroke="#dc2626" stroke-width="2" />
  
  <!-- Phone Notch -->
  <rect x="880" y="145" width="100" height="18" rx="9" fill="#181822" />
  
  <!-- Phone Screen Header -->
  <text x="770" y="195" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800">AgentLink Mobile</text>
  <text x="770" y="215" fill="#dc2626" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">REMOTE APPROVAL NOTIFICATION</text>

  <!-- Phone Card: Approval Box -->
  <rect x="765" y="235" width="330" height="260" rx="18" fill="#14141d" stroke="#333345" stroke-width="1.5" />
  <rect x="785" y="255" width="36" height="36" rx="8" fill="#dc2626" />
  <text x="796" y="279" fill="#ffffff" font-family="sans-serif" font-size="18">🔔</text>
  <text x="832" y="270" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Approval Request</text>
  <text x="832" y="288" fill="#9ca3af" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Home Laptop • VS Code Agent</text>

  <rect x="785" y="305" width="290" height="70" rx="10" fill="#0b0b10" stroke="#22222e" />
  <text x="797" y="328" fill="#e5e7eb" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Execute: vercel --prod</text>
  <text x="797" y="350" fill="#9ca3af" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Do you allow this action?</text>

  <!-- Approve Button -->
  <rect x="785" y="390" width="140" height="44" rx="10" fill="#22c55e" />
  <text x="820" y="417" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">✓ APPROVE</text>

  <!-- Reject Button -->
  <rect x="935" y="390" width="140" height="44" rx="10" fill="#dc2626" />
  <text x="975" y="417" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">✕ REJECT</text>

  <text x="785" y="465" fill="#6b7280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" text-anchor="start">Auto-dismisses on action • Encrypted tunnel</text>

  <!-- Phone Prompt Input at bottom -->
  <rect x="765" y="520" width="330" height="50" rx="12" fill="#161722" stroke="#2a2a3c" />
  <text x="785" y="550" fill="#6b7280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">Send new prompt to agent...</text>
  <rect x="1040" y="528" width="45" height="34" rx="8" fill="#dc2626" />
  <text x="1056" y="549" fill="#ffffff" font-family="sans-serif" font-size="14">➔</text>
</svg>

