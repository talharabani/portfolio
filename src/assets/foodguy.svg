<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fgbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100e"/>
      <stop offset="100%" stop-color="#1e1610"/>
    </linearGradient>
    <linearGradient id="fgorange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#fgbg)"/>
  <rect x="30" y="30" width="740" height="440" rx="16" fill="#18130e" stroke="#2e241c" stroke-width="1.5"/>
  <!-- Window Controls -->
  <circle cx="55" cy="55" r="5" fill="#ef4444"/>
  <circle cx="72" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="89" cy="55" r="5" fill="#10b981"/>
  <text x="400" y="60" fill="#a8a29e" font-size="12" font-family="monospace" text-anchor="middle">food-guy.vercel.app — Modern Fast Food &amp; Ordering</text>

  <!-- Header -->
  <text x="80" y="110" fill="#ffffff" font-size="24" font-weight="900" font-family="sans-serif">FOOD<tspan fill="url(#fgorange)">GUY</tspan></text>
  <text x="80" y="135" fill="#f97316" font-size="11" font-family="sans-serif" font-weight="bold">Johar Town, Lahore • 30-45 Min Fast Delivery</text>

  <!-- Big Hero Title -->
  <text x="80" y="200" fill="#ffffff" font-size="42" font-weight="900" font-family="sans-serif" letter-spacing="2">BITE INTO</text>
  <text x="80" y="245" fill="url(#fgorange)" font-size="42" font-weight="900" font-family="sans-serif" letter-spacing="2">PERFECTION</text>

  <text x="80" y="290" fill="#d6d3d1" font-size="12" font-family="sans-serif">Hand-breaded zinger fillets, buns toasted to order and sauces whipped fresh.</text>
  <text x="80" y="310" fill="#a8a29e" font-size="12" font-family="sans-serif">Real-time interactive menu, live cart checkout, and instant ordering.</text>

  <!-- Order CTA -->
  <rect x="80" y="345" width="130" height="40" rx="8" fill="url(#fgorange)"/>
  <text x="145" y="370" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">ORDER NOW</text>

  <rect x="225" y="345" width="130" height="40" rx="8" fill="#292524" stroke="#44403c"/>
  <text x="290" y="370" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">VIEW MENU</text>

  <!-- Burger / Food Badge visual on right -->
  <rect x="480" y="110" width="240" height="280" rx="16" fill="#231c15" stroke="#3d2d20" stroke-width="1.5"/>
  <circle cx="600" cy="230" r="70" fill="#292524" stroke="url(#fgorange)" stroke-width="4"/>
  <text x="600" y="225" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">GOURMET</text>
  <text x="600" y="245" fill="#f97316" font-size="15" font-weight="900" font-family="sans-serif" text-anchor="middle">ZINGER</text>
  <rect x="540" y="320" width="120" height="26" rx="4" fill="#ea580c"/>
  <text x="600" y="338" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Rs. 700 Starting</text>
</svg>

