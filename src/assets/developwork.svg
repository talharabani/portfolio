  <text x="625" y="575" fill="#f87171" font-family="sans-serif" font-size="11">TASK-892 • High Priority</text>
  <text x="625" y="598" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Vercel Deployment</text>
  <text x="625" y="625" fill="#fca5a5" font-family="sans-serif" font-size="11">Auto-assigned: DevOps Eng</text>

  <rect x="850" y="550" width="220" height="95" rx="10" fill="#181a24" stroke="#262a3d" />
  <text x="865" y="575" fill="#94a3b8" font-family="sans-serif" font-size="11">TASK-893 • Verified</text>
  <text x="865" y="598" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Client Approval Sign-Off</text>
  <text x="865" y="625" fill="#34d399" font-family="sans-serif" font-size="11">Status: Completed 100%</text>
