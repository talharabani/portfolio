<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#00140f" />
  
  <defs>
    <radialGradient id="cwtGlow" cx="50%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#00ffae" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#00a36c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00140f" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cwtCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00231b" />
      <stop offset="100%" stop-color="#001712" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffae" />
      <stop offset="100%" stop-color="#00d18c" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#cwtGlow)" />

  <!-- Outer Dashboard Frame -->
  <rect x="40" y="35" width="1120" height="680" rx="20" fill="#001913" stroke="#004d38" stroke-width="1.5" />

  <!-- Top Brand Navigation Bar -->
  <rect x="40" y="35" width="1120" height="68" rx="20" fill="#001e17" stroke="#003d2d" stroke-width="1" />
  
  <!-- Logo Pill & Name -->
  <rect x="65" y="51" width="36" height="36" rx="10" fill="#00ffae" />
  <path d="M76 69C76 63 80 59 86 59C90 59 93 62 93 66C93 72 84 73 84 77" stroke="#00140f" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="84" cy="81" r="1.5" fill="#00140f" />
  <text x="112" y="74" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800">ChatWithoutTalk</text>
  <rect x="300" y="55" width="190" height="28" rx="6" fill="#002e22" stroke="#00573e" />
  <text x="312" y="73" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● 24/7 WHATSAPP AI AGENT</text>

  <!-- Live Meta API Status Pill -->
  <rect x="915" y="53" width="220" height="32" rx="8" fill="#00ffae" fill-opacity="0.12" stroke="#00ffae" stroke-opacity="0.3" />
  <circle cx="935" cy="69" r="4" fill="#00ffae" />
  <text x="948" y="73" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Official Meta Cloud API • Live</text>

  <!-- Hero Content Strip -->
  <text x="75" y="152" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800">Turn WhatsApp into an Autonomous 24/7 AI Sales Agent</text>
  <text x="75" y="180" fill="#71a896" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14">Automates replies, qualifies leads, transcribes audio voice notes, reads PDFs, and books appointments across 100+ languages.</text>

  <!-- Left: Live WhatsApp Chat Simulation Card -->
  <rect x="75" y="215" width="560" height="465" rx="16" fill="url(#cwtCardGrad)" stroke="#004d38" stroke-width="1.2" />
  
  <!-- Chat Header -->
  <rect x="75" y="215" width="560" height="56" rx="16" fill="#002a20" stroke="#003d2d" stroke-width="1" />
  <circle cx="108" cy="243" r="15" fill="#00ffae" fill-opacity="0.2" stroke="#00ffae" stroke-width="1.5" />
  <text x="102" y="248" fill="#00ffae" font-family="sans-serif" font-size="13" font-weight="bold">AI</text>
  <text x="135" y="241" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">ChatWithoutTalk AI Employee</text>
  <text x="135" y="257" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">Active now • Responding in sub-second</text>

  <!-- Message 1 (Customer English) -->
  <rect x="270" y="290" width="345" height="52" rx="12" fill="#00382b" stroke="#00573e" />
  <text x="285" y="312" fill="#e2f7f0" font-family="sans-serif" font-size="12">Hi! Can you provide a custom quote for 5,000</text>
  <text x="285" y="330" fill="#e2f7f0" font-family="sans-serif" font-size="12">units and check available delivery slots?</text>
  <text x="575" y="335" fill="#71a896" font-family="monospace" font-size="9">10:42 AM ✓✓</text>

  <!-- Message 2 (AI Instant Response with Price & Calendar) -->
  <rect x="95" y="354" width="375" height="66" rx="12" fill="#00241b" stroke="#00ffae" stroke-opacity="0.3" />
  <text x="110" y="375" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ChatWithoutTalk AI [Qualified Lead - Score 98]</text>
  <text x="110" y="394" fill="#ffffff" font-family="sans-serif" font-size="12">Hello! Our bulk rate for 5,000 units is $2.40/unit.</text>
  <text x="110" y="411" fill="#ffffff" font-family="sans-serif" font-size="12">I have held Thursday 3 PM for your dispatch call.</text>

  <!-- Message 3 (Customer Urdu / Multilingual) -->
  <rect x="295" y="432" width="320" height="48" rx="12" fill="#00382b" stroke="#00573e" />
  <text x="310" y="454" fill="#e2f7f0" font-family="sans-serif" font-size="12">کیا کیٹلاگ اور پیمنٹ کا طریقہ بھیج سکتے ہیں؟</text>
  <text x="575" y="472" fill="#71a896" font-family="monospace" font-size="9">10:43 AM ✓✓</text>

  <!-- Message 4 (AI Multilingual Reply) -->
  <rect x="95" y="492" width="375" height="56" rx="12" fill="#00241b" stroke="#00ffae" stroke-opacity="0.3" />
  <text x="110" y="513" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">Auto-Detected: Urdu (Ur) • Native Tone</text>
  <text x="110" y="533" fill="#ffffff" font-family="sans-serif" font-size="12">جی بالکل! کیٹلاگ منسلک ہے اور آپ بذریعہ بینک ٹرانسفر ادائیگی کر سکتے ہیں۔</text>

  <!-- Message 5 (Voice Note Intelligence) -->
  <rect x="95" y="560" width="375" height="52" rx="12" fill="#002f23" stroke="#00ffae" stroke-opacity="0.4" />
  <circle cx="120" cy="586" r="12" fill="#00ffae" />
  <polygon points="117,581 126,586 117,591" fill="#00140f" />
  <text x="142" y="583" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Voice Note Transcribed &amp; Analyzed (0:24)</text>
  <text x="142" y="599" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">Whisper AI: Extracted customer name, address &amp; order</text>

  <!-- Chat Input Bar -->
  <rect x="95" y="628" width="520" height="38" rx="19" fill="#001812" stroke="#00402e" />
  <text x="115" y="652" fill="#588576" font-family="sans-serif" font-size="11">Type a message or trigger automated AI scenario...</text>
  <circle cx="595" cy="647" r="12" fill="#00ffae" />
  <path d="M591 647L598 647M595 643L599 647L595 651" stroke="#00140f" stroke-width="2" stroke-linecap="round" />

  <!-- Right: 3 Core Capability Modules -->
  <!-- Module 1: Multilingual in 100+ Languages -->
  <rect x="660" y="215" width="465" height="142" rx="14" fill="#001e17" stroke="#004734" />
  <rect x="680" y="233" width="34" height="34" rx="8" fill="#00ffae" fill-opacity="0.15" stroke="#00ffae" stroke-opacity="0.4" />
  <text x="690" y="255" fill="#00ffae" font-family="sans-serif" font-size="16">🌐</text>
  <text x="726" y="252" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">100+ Languages Auto-Detection</text>
  <text x="680" y="290" fill="#88bba9" font-family="sans-serif" font-size="12">Detects customer language instantly. Replies natively in Urdu, Arabic, English, Spanish and German while preserving your company's exact brand tone.</text>
  <rect x="680" y="318" width="125" height="22" rx="5" fill="#002d21" />
  <text x="688" y="333" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">Zero Manual Config</text>
  <rect x="815" y="318" width="145" height="22" rx="5" fill="#002d21" />
  <text x="823" y="333" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">Dialect &amp; Roman Urdu</text>

  <!-- Module 2: Voice Notes & Document OCR -->
  <rect x="660" y="372" width="465" height="142" rx="14" fill="#001e17" stroke="#00ffae" stroke-width="1.3" />
  <rect x="680" y="390" width="34" height="34" rx="8" fill="#00ffae" fill-opacity="0.15" stroke="#00ffae" stroke-opacity="0.4" />
  <text x="690" y="412" fill="#00ffae" font-family="sans-serif" font-size="16">🎙</text>
  <text x="726" y="409" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Voice Notes &amp; PDF Intelligence</text>
  <text x="680" y="447" fill="#88bba9" font-family="sans-serif" font-size="12">Listens to and transcribes voice notes with Whisper AI. Reads attached PDF price menus, brochures, and extracts applicant CV details automatically.</text>
  <rect x="680" y="475" width="140" height="22" rx="5" fill="#002d21" />
  <text x="688" y="490" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">Whisper Voice Engine</text>
  <rect x="830" y="475" width="130" height="22" rx="5" fill="#002d21" />
  <text x="838" y="490" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">PDF Document RAG</text>

  <!-- Module 3: Lead Scoring & Instant CRM Sync -->
  <rect x="660" y="529" width="465" height="151" rx="14" fill="#001e17" stroke="#004734" />
  <rect x="680" y="547" width="34" height="34" rx="8" fill="#00ffae" fill-opacity="0.15" stroke="#00ffae" stroke-opacity="0.4" />
  <text x="690" y="569" fill="#00ffae" font-family="sans-serif" font-size="16">⚡</text>
  <text x="726" y="566" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">AI Lead Scoring &amp; CRM Sync</text>
  <text x="680" y="604" fill="#88bba9" font-family="sans-serif" font-size="12">Calculates intent score (0-100) from 50+ real-time signals. Dispatches high-ticket customer notifications to your sales reps &amp; auto-syncs CRM tables.</text>
  <rect x="680" y="635" width="140" height="24" rx="5" fill="#002d21" />
  <text x="688" y="651" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">50+ Intent Signals</text>
  <rect x="830" y="635" width="135" height="24" rx="5" fill="#002d21" />
  <text x="838" y="651" fill="#00ffae" font-family="'JetBrains Mono', monospace" font-size="10">Auto Order &amp; Booking</text>

</svg>

